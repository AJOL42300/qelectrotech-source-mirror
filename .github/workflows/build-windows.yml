name: Build Windows (zip)

# Simple Windows build of this fork: Qt 6.8.3 + MinGW, CMake/Ninja, no tests.
# It publishes a portable folder (bin/, elements/, titleblocks/, lang/ ...)
# as a zip artifact. See docs/build-windows-github-actions.md.

on:
  workflow_dispatch:
  push:
    branches:
      - 'ajol42300-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'
  SQLITE_URL: https://www.sqlite.org/2025/sqlite-amalgamation-3500400.zip
  SQLITE_SHA256: 1D3049DD0F830A025A53105FC79FD2AB9431AEA99E137809D064D8EE8356B032

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout (with the elements submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: Put the Qt MinGW toolchain first in PATH
        run: |
          $mingw = Join-Path $env:IQTA_TOOLS 'mingw1310_64\bin'
          if (-not (Test-Path "$mingw\g++.exe")) { throw "g++ not found in $mingw" }
          $mingw | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build SQLite with the session extension
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sqlite.zip'
          Invoke-WebRequest -Uri $env:SQLITE_URL -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne $env:SQLITE_SHA256) { throw "SQLite checksum mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP 'sqlite'
          Expand-Archive $zip -DestinationPath $dir
          $src = (Get-ChildItem $dir -Directory | Select-Object -First 1).FullName
          Push-Location $src
          gcc -c -O2 -DSQLITE_ENABLE_SESSION -DSQLITE_ENABLE_PREUPDATE_HOOK sqlite3.c -o sqlite3.o
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ar rcs libsqlite3.a sqlite3.o
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
          "SQLITE_DIR=$src" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            -DBUILD_WITH_KF=OFF `
            -DPACKAGE_TESTS=OFF `
            -DQET_DEPLOY_QT=ON `
            "-DSQLite3_INCLUDE_DIR=$env:SQLITE_DIR" `
            "-DSQLite3_LIBRARY=$env:SQLITE_DIR/libsqlite3.a"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build
        run: |
          cmake --build build --parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Install into the portable folder (exe, Qt DLLs, elements, titleblocks, lang)
        run: |
          cmake --install build --prefix dist/QElectroTech
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Check the portable folder
        run: |
          $root = 'dist/QElectroTech'
          foreach ($p in 'bin/QElectroTech.exe', 'elements', 'titleblocks', 'lang') {
            if (-not (Test-Path "$root/$p")) { throw "Missing in the package: $p" }
          }
          $qm = @(Get-ChildItem "$root/lang" -Filter 'qet_*.qm').Count
          if ($qm -lt 1) { throw 'No .qm translation in lang/' }
          Write-Host "$qm .qm files in lang/"
          Get-ChildItem "$root/bin" | Select-Object Name, Length | Format-Table

      - name: Zip
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 7)
          $name = "QElectroTech-win64-qt$env:QT_VERSION-$short"
          Compress-Archive -Path 'dist/QElectroTech' -DestinationPath "$name.zip"
          "ZIP_NAME=$name" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
          compression-level: 0
          if-no-files-found: error
